<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>OpenGrid Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; color: white; }

    #app { width: 100%; height: 100%; position: relative; }

    /* Gallery */
    #gallery { display: flex; flex-direction: column; height: 100%; padding: 24px; overflow-y: auto; }
    #gallery h1 { text-align: center; font-size: 28px; margin-bottom: 24px; padding-top: 8px; }
    #gallery-grid { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; align-items: flex-start; }
    .dash-card {
      width: 260px; background: #1a1a1a; border-radius: 8px; overflow: hidden;
      cursor: pointer; transition: transform .15s, box-shadow .15s;
    }
    .dash-card:hover { transform: scale(1.03); box-shadow: 0 4px 20px rgba(255,255,255,.15); }
    .dash-card-img { width: 100%; height: 140px; background: #2a2a2a; display: flex; align-items: center; justify-content: center; font-size: 40px; }
    .dash-card-body { padding: 12px 16px 16px; }
    .dash-card-body h3 { font-size: 16px; margin-bottom: 4px; }
    .dash-card-body p { font-size: 12px; opacity: .6; }

    /* Dashboard viewer */
    #viewer { display: none; width: 100%; height: 100%; position: relative; }
    #viewer.active { display: flex; }
    #dash-content { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* Swipe handle */
    #swipe-handle {
      position: absolute; top: 0; left: 0; right: 0; height: 28px; z-index: 10;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    #swipe-handle .bar {
      width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.3);
      transition: background .2s;
    }
    #swipe-handle:hover .bar { background: rgba(255,255,255,.5); }

    /* Popup menu overlay */
    #menu-overlay {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.5);
    }
    #menu-overlay.open { display: block; }
    #menu-panel {
      width: 280px; margin: 0 auto; padding: 20px; border-radius: 0 0 12px 12px;
      background: #1a1a1a; box-shadow: 0 4px 24px rgba(0,0,0,.6);
    }
    #menu-panel h2 { font-size: 16px; margin-bottom: 16px; text-align: center; }
    #menu-panel button {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px;
      border: none; border-radius: 6px; background: #2a2a2a; color: white;
      font-family: inherit; font-size: 14px; cursor: pointer; transition: background .15s;
      margin-bottom: 8px;
    }
    #menu-panel button:hover { background: #3a3a3a; }
    #menu-panel button svg { width: 20px; height: 20px; flex-shrink: 0; fill: currentColor; }

    .loading { text-align: center; margin-top: 40px; opacity: .5; font-size: 14px; }
  </style>
</head>
<body>
<div id="app">
  <!-- Gallery -->
  <div id="gallery">
    <h1>OpenGrid Dashboards</h1>
    <div id="gallery-grid"></div>
  </div>

  <!-- Dashboard viewer -->
  <div id="viewer">
    <div id="swipe-handle"><div class="bar"></div></div>
    <div id="dash-content"><!--DASHBOARD_CONTENT--></div>
  </div>

  <!-- Popup menu overlay -->
  <div id="menu-overlay">
    <div id="menu-panel">
      <h2>Dashboard Controls</h2>
      <button id="btn-fullscreen">
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        Fullscreen
      </button>
      <button id="btn-back">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Back to Dashboards
      </button>
    </div>
  </div>
</div>

<script>
var gearMap = {'R':'R','N':'N','N1':'1','N2':'2','N3':'3','N4':'4','N5':'5','N6':'6'};

function formatTime(ts) {
  if (!ts || ts === '00:00:00' || ts === '--:--') return '--:--';
  try {
    var negative = ts.charAt(0) === '-';
    var abs = negative ? ts.substring(1) : ts;
    var parts = abs.split(':');
    if (parts.length === 3) {
      var secParts = parts[2].split('.');
      var frac = (secParts[1] || '000').substring(0, 3);
      return parts[0] + ':' + secParts[0] + '.' + frac;
    }
  } catch(e) {}
  return ts;
}

function formatTimeShort(ts) {
  if (!ts || ts === '00:00:00') return '0.00';
  try {
    var negative = ts.charAt(0) === '-';
    var abs = negative ? ts.substring(1) : ts;
    var parts = abs.split(':');
    if (parts.length === 3) {
      var secParts = parts[2].split('.');
      var frac = (secParts[1] || '00').substring(0, 2);
      return secParts[0] + '.' + frac;
    }
  } catch(e) {}
  return ts;
}

function getSessionLabel(type) {
  switch (type) {
    case 'Practice': return 'PRACTICE';
    case 'Qualify': return 'QUALIFY';
    case 'Race': return 'RACE';
    case 'HotLap': return 'HOTLAP';
    case 'TimeAttack': return 'ATTACK';
    case 'Drift': return 'DRIFT';
    case 'Drag': return 'DRAG';
    default: return 'SESSION';
  }
}

// ====== State ======
var currentDashboardId = null;

// ====== Gallery ======
function loadGallery() {
  var grid = document.getElementById('gallery-grid');
  grid.innerHTML = '<div class="loading">Loading dashboards...</div>';

  fetch('/api/dashboards')
    .then(function(r) { return r.json(); })
    .then(function(list) {
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="loading">No dashboards found.</div>';
        return;
      }
      grid.innerHTML = '';
      list.forEach(function(d) {
        var card = document.createElement('div');
        card.className = 'dash-card';
        var imgHtml = d.image
          ? '<img src="' + esc(d.image) + '" style="width:100%;height:140px;object-fit:cover;display:block" alt="" />'
          : '<div class="dash-card-img">&#9632;</div>';
        card.innerHTML =
          imgHtml +
          '<div class="dash-card-body">' +
          '<h3>' + esc(d.name) + '</h3>' +
          '<p>' + esc(d.description || '') + '</p>' +
          '</div>';
        card.addEventListener('click', function() { openDashboard(d.id); });
        grid.appendChild(card);
      });
    })
    .catch(function() {
      grid.innerHTML = '<div class="loading">Failed to load dashboards.</div>';
    });
}

function esc(s) {
  var d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// ====== Dashboard Loading ======
function openDashboard(id) {
  currentDashboardId = id;
  document.getElementById('gallery').style.display = 'none';
  var viewer = document.getElementById('viewer');
  viewer.classList.add('active');
  document.getElementById('dash-content').innerHTML = '<div class="loading">Loading dashboard...</div>';

  fetch('/api/dashboard/' + encodeURIComponent(id) + '/html')
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('dash-content').innerHTML = data.html || '';
      if (typeof dashboardOnLoad === 'function') dashboardOnLoad();
    })
    .catch(function() {
      document.getElementById('dash-content').innerHTML = '<div class="loading">Failed to load dashboard.</div>';
    });
}

function goBackToGallery() {
  closeMenu();
  currentDashboardId = null;
  document.getElementById('gallery').style.display = '';
  document.getElementById('viewer').classList.remove('active');
}

// ====== Popup Menu ======
function openMenu() {
  document.getElementById('menu-overlay').classList.add('open');
}

function closeMenu() {
  document.getElementById('menu-overlay').classList.remove('open');
}

document.getElementById('menu-overlay').addEventListener('click', function(e) {
  if (e.target === document.getElementById('menu-overlay')) {
    closeMenu();
  }
});

document.getElementById('btn-fullscreen').addEventListener('click', function() {
  var el = document.documentElement;
  if (el.requestFullscreen) {
    if (document.fullscreenElement) { document.exitFullscreen().catch(function(){}); }
    else { el.requestFullscreen().catch(function(){}); }
  } else if (el.webkitRequestFullscreen) {
    el.webkitRequestFullscreen();
  } else if (el.msRequestFullscreen) {
    el.msRequestFullscreen();
  }
});

document.getElementById('btn-back').addEventListener('click', goBackToGallery);

// ====== Swipe Gesture ======
(function() {
  var handle = document.getElementById('swipe-handle');
  var startY = 0;
  var dragging = false;

  function onDown(e) {
    var point = e.touches ? e.touches[0] : e;
    startY = point.clientY;
    dragging = true;
  }

  function onMove(e) {
    if (!dragging) return;
    var point = e.touches ? e.touches[0] : e;
    var dy = point.clientY - startY;
    if (dy > 40) {
      dragging = false;
      openMenu();
    }
  }

  function onUp(e) {
    if (dragging) {
      var point = e.changedTouches ? e.changedTouches[0] : e;
      var dy = point.clientY - startY;
      if (dy > 40) {
        openMenu();
      } else {
        openMenu();
      }
      dragging = false;
    }
  }

  handle.addEventListener('pointerdown', onDown);
  handle.addEventListener('pointermove', onMove);
  handle.addEventListener('pointerup', onUp);
  handle.addEventListener('pointercancel', function() { dragging = false; });

  handle.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
})();

// ====== Init for server-injected content ======
if (typeof dashboardOnLoad === 'function') dashboardOnLoad();

// ====== WebSocket Telemetry ======
var scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
var wsUrl = scheme + '//' + location.host + '/ws';
var ws = null;
var reconnectTimer = null;

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  ws = new WebSocket(wsUrl);
  ws.onopen = function() { document.body.style.opacity = '1'; };
  ws.onclose = function() { reconnectTimer = setTimeout(connect, 2000); };
  ws.onerror = function() { ws.close(); };
  ws.onmessage = function(e) {
    try {
      var msg = JSON.parse(e.data);
      if (msg.type === 'telemetry' && typeof update === 'function') update(msg.data);
    } catch(_) {}
  };
}

connect();

// ====== Init ======
loadGallery();
</script>
</body>
</html>
