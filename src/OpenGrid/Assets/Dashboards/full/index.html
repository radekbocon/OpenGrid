<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Dashboard</title>
    <script src="/framework/opengrid.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dash {
            flex-shrink: 0;
            width: 1280px;
            height: 720px;
            background: #000;
            padding: 12px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: 120px 140px 140px 140px 120px;
        }

        .dash > * {
            min-width: 0;
            min-height: 0;
            overflow: hidden;
        }

        .tile {
            border-radius: 8px;
            border: 2px solid #333;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .label {
            font-size: 28px;
            letter-spacing: 2px;
        }

        .value {
            font-size: 52px;
            font-weight: bold;
        }

        .value-delta {
            font-size: 42px;
            font-weight: bold;
        }

        .red {
            background: linear-gradient(#900, #f00);
        }

        .blue {
            background: linear-gradient(#1c5fa7, #3a9cff);
        }

        .gray {
            background: linear-gradient(#666, #d5d5d5);
            color: black;
        }

        .green {
            background: linear-gradient(#005f00, #18c918);
        }

        .yellow {
            background: linear-gradient(#c4a000, #ffd400);
            color: black;
        }

        .black {
            background: #050505;
        }

        .lap-counter, .bbal {
            border-radius: 8px;
            border: 2px solid #555;
            background: #999;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lap-counter .value {
            font-size: 54px;
        }

        .speed {
            border-radius: 8px;
            border: 2px solid #555;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .speed .value {
            color: black;
        }

        .rpm {
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            color: white;
            padding: 15px;
        }

        .rpm-scale {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 5px;
            width: 100%;
            border-top: 2px solid #444;
            border-bottom: 2px solid #444;
            padding: 5px 0;
        }

        .rpm-scale span {
            flex: 1;
            height: 24px;
            border-radius: 3px;
            background: #a00;
        }

        .rpm-labels {
            display: flex;
            justify-content: center;
            gap: 5px;
            width: 100%;
            font-size: 14px;
            color: #fff;
        }

        .rpm-labels span {
            flex: 1;
            text-align: center;
        }

        .rpm-value {
            font-size: 28px;
            font-weight: bold;
            color: #fff;
            margin-top: 5px;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pressure-group {
            grid-column: 1 / 4;
            grid-row: 2 / 4;
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 1fr;
        }

        .temp-group {
            grid-column: 7 / 10;
            grid-row: 2 / 4;
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 1fr;
        }

        .gear {
            width: 250px;
            height: 290px;
            border-radius: 8px;
            background: linear-gradient(#ddd, #aaa);
            color: black;
            font-size: 170px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-box {
            background: #111;
            border: 2px solid #444;
            color: white;
            border-radius: 8px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .footer-title {
            font-size: 28px;
        }

        .footer-value {
            font-size: 48px;
        }
    </style>
</head>
<body>

<div class="dash">

    <div class="tile" style="grid-column:1/3;grid-row:1">
        <div class="label" id="sessDisp">RACE</div>
    </div>

    <div class="lap-counter" style="grid-column:3;grid-row:1">
        <div class="label">LAP</div>
        <div class="value" id="lapCntr">69</div>
    </div>

    <div class="rpm" style="grid-column:4/7;grid-row:1">
        <div class="rpm-labels" id="shiftLabels">
            <span>0</span>
            <span>1</span>
            <span>2</span>
            <span>3</span>
            <span>4</span>
            <span>5</span>
            <span>6</span>
            <span>7</span>
            <span>8</span>
            <span>9</span>
            <span>10</span>
            <span>11</span>
        </div>
        <div class="rpm-scale" id="shiftLights">
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#ff0"></span>
            <span style="background:#660"></span>
            <span style="background:#600"></span>
            <span style="background:#600"></span>
        </div>
        <div class="rpm-value" id="rpmValue">8420</div>
    </div>

    <div class="speed gray" style="grid-column:7/10;grid-row:1">
        <div class="label">SPEED</div>
        <div class="value" id="speedDisp">133.7</div>
    </div>

    <div class="pressure-group">
        <div class="tile red">
            <div class="label">P_FL</div>
            <div class="value" id="pfL">31.2</div>
        </div>
        <div class="tile blue">
            <div class="label">P_FR</div>
            <div class="value" id="pfR">25.2</div>
        </div>
        <div class="tile blue">
            <div class="label">P_RL</div>
            <div class="value" id="prL">27.6</div>
        </div>
        <div class="tile black">
            <div class="label">P_RR</div>
            <div class="value" id="prR">24.9</div>
        </div>
    </div>

    <div class="center" style="grid-column:4/7;grid-row:2/4">
        <div class="gear" id="gearDisp">3</div>
    </div>

    <div class="temp-group">
        <div class="tile blue">
            <div class="label">T_FL</div>
            <div class="value" id="tfL">77</div>
        </div>
        <div class="tile blue">
            <div class="label">T_FR</div>
            <div class="value" id="tfR">85</div>
        </div>
        <div class="tile blue">
            <div class="label">T_RL</div>
            <div class="value" id="trL">78</div>
        </div>
        <div class="tile red">
            <div class="label">T_RR</div>
            <div class="value" id="trR">111</div>
        </div>
    </div>

    <div class="tile" style="grid-column:1;grid-row:4">
        <div class="label">MIX</div>
        <div class="value" id="mixDisp">3</div>
    </div>

    <div class="tile" style="grid-column:2;grid-row:4">
        <div class="label">POS</div>
        <div class="value" id="posDisp">15</div>
    </div>

    <div class="tile red" style="grid-column:3;grid-row:4">
        <div class="label">ABS</div>
        <div class="value" id="absDisp">OFF</div>
    </div>

    <div class="tile yellow" style="grid-column:4;grid-row:4">
        <div class="label">FUEL</div>
        <div class="value" id="fuelDisp">27.4</div>
    </div>

    <div class="tile green" style="grid-column:5;grid-row:4">
        <div class="label">DELTA</div>
        <div class="value-delta" id="deltaTime">-2.32</div>
    </div>

    <div class="bbal" style="grid-column:6;grid-row:4">
        <div class="label">BBAL</div>
        <div class="value" id="bbalDisp">65.4</div>
    </div>

    <div class="tile green" style="grid-column:7;grid-row:4">
        <div class="label">TC1</div>
        <div class="value" id="tc1Disp">2</div>
    </div>

    <div class="tile green" style="grid-column:8;grid-row:4">
        <div class="label">TC2</div>
        <div class="value" id="tc2Disp">5</div>
    </div>

    <div class="tile red" style="grid-column:9;grid-row:4">
        <div class="label">TC3</div>
        <div class="value" id="tc3Disp">OFF</div>
    </div>

    <div class="footer-box" style="grid-column:1/4;grid-row:5">
        <div class="footer-title">PREV LAP</div>
        <div class="footer-value" id="prevLap">01:46.86</div>
    </div>

    <div class="footer-box" style="grid-column:4/7;grid-row:5">
        <div class="footer-title">LAP</div>
        <div class="footer-value" id="lastLap">01:46.86</div>
    </div>

    <div class="footer-box" style="grid-column:7/10;grid-row:5">
        <div class="footer-title">BEST LAP</div>
        <div class="footer-value" id="bestLap">01:46.47</div>
    </div>

</div>

<div id="status" style="display:none"></div>

<script>
    const numShiftLights = 12;
    let targetRpm = 0, currentRpm = 0, targetSpeed = 0, currentSpeed = 0, maxRpm = 8000;

    function fitToViewport() {
        const d = document.querySelector('.dash');
        const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        d.style.transform = 'scale(' + s + ')';
        d.style.transformOrigin = 'center';
    }

    window.addEventListener('resize', fitToViewport);
    fitToViewport();

    function updateShiftLights(rp) {
        const lights = document.getElementById('shiftLights');
        const spans = lights.getElementsByTagName('span');
        for (let i = 0; i < numShiftLights && i < spans.length; i++) {
            const th = .6 + (i / numShiftLights) * .4;
            const on = rp >= th;
            if (i < 8) {
                spans[i].style.background = on ? '#0f0' : '#060';
            } else if (i < 10) {
                spans[i].style.background = on ? '#ff0' : '#660';
            } else {
                spans[i].style.background = on ? '#f00' : '#600';
            }
        }
    }

    function updateShiftLabels(mr) {
        const labels = document.getElementById('shiftLabels');
        if (!labels) return;
        const spans = labels.getElementsByTagName('span');
        for (let i = 0; i < numShiftLights && i < spans.length; i++) {
            if (i === 0 || i === 3 || i === 6 || i === 9 || i === numShiftLights - 1) {
                const rpm = Math.round((i / (numShiftLights - 1)) * mr);
                spans[i].textContent = rpm >= 1000 ? (rpm / 1000).toFixed(1) : rpm.toString();
            } else {
                spans[i].textContent = '';
            }
        }
    }

    function renderFrame() {
        const rp = Math.min(currentRpm / maxRpm, 1);
        document.getElementById('speedDisp').textContent = currentSpeed.toFixed(1);
        document.getElementById('rpmValue').textContent = Math.round(currentRpm).toString();
        updateShiftLights(rp);
        updateShiftLabels(maxRpm);
    }

    function animationLoop() {
        currentRpm += (targetRpm - currentRpm) * .12;
        currentSpeed += (targetSpeed - currentSpeed) * .12;
        if (Math.abs(currentRpm - targetRpm) < 1) currentRpm = targetRpm;
        if (Math.abs(currentSpeed - targetSpeed) < .5) currentSpeed = targetSpeed;
        renderFrame();
        requestAnimationFrame(animationLoop);
    }

    function formatTime(ms) {
        if (!ms || ms <= 0) return '--:--';
        const s = ms / 1e3;
        const m = Math.floor(s / 60);
        return m + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60).toFixed(3);
    }

    function setTile(id, val) {
        const el = document.getElementById(id);
        if (!el) return;
        const p = el.parentNode;
        if (val === undefined || val === null || val === 0 || val === '0' || val === 'OFF') {
            el.textContent = 'OFF';
            p.className = 'tile red';
        } else {
            el.textContent = val;
            p.className = 'tile green';
        }
    }

    function updateTempTile(id, v) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = v.toFixed(1);
        el.parentNode.className = v < 70 ? 'tile black' : v <= 100 ? 'tile blue' : 'tile red';
    }

    function updatePressureTile(id, v) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = v.toFixed(1);
        el.parentNode.className = v < 26 ? 'tile black' : v <= 28 ? 'tile blue' : 'tile red';
    }

    OpenGrid.onTelemetry = function (d) {
        targetRpm = d.engineRpm || 0;
        maxRpm = d.maxRpm || 8000;
        updateShiftLabels(maxRpm);
        targetSpeed = d.speedKmh || 0;
        document.getElementById('gearDisp').textContent = d.gear || 'N';
        document.getElementById('lapCntr').textContent = d.currentLap || '--';
        document.getElementById('prevLap').textContent = formatTime(d.lastLapTimeMs);
        document.getElementById('lastLap').textContent = formatTime(d.lapTimeMs);
        document.getElementById('bestLap').textContent = formatTime(d.bestLapTimeMs);

        const de = document.getElementById('deltaTime');
        const dt = de.parentNode;
        if (d.deltaLapTimeMs !== undefined && d.deltaLapTimeMs !== null && !isNaN(d.deltaLapTimeMs)) {
            const sec = Math.abs(d.deltaLapTimeMs) / 1000;
            de.textContent = (d.deltaLapTimeMs >= 0 ? '+' : '-') + sec.toFixed(2);
            dt.className = d.deltaLapTimeMs >= 0 ? 'tile red' : 'tile green';
        } else {
            de.textContent = '--:--';
            dt.className = 'tile gray';
        }
        document.getElementById('fuelDisp').textContent = (d.fuel || 0).toFixed(1);
        document.getElementById('posDisp').textContent = d.position || '--';
        document.getElementById('sessDisp').textContent = d.sessionType || 'RACE';
        document.getElementById('bbalDisp').textContent = (d.brakeBias || 0).toFixed(1);

        setTile('absDisp', d.absSetting);
        setTile('tc1Disp', d.tc1Setting);
        setTile('tc2Disp', d.tc2Setting);
        setTile('tc3Disp', d.tc3Setting);

        if (d.tireTemps) {
            const t = d.tireTemps;
            updateTempTile('tfL', t.fl);
            updateTempTile('tfR', t.fr);
            updateTempTile('trL', t.rl);
            updateTempTile('trR', t.rr);
        }
        if (d.tirePressures) {
            const p = d.tirePressures;
            updatePressureTile('pfL', p.fl);
            updatePressureTile('pfR', p.fr);
            updatePressureTile('prL', p.rl);
            updatePressureTile('prR', p.rr);
        }
    };

    OpenGrid.onConnected = function () {
    };
    OpenGrid.onDisconnected = function () {
    };
    OpenGrid.connect({port: 8190});
    animationLoop();
</script>
</body>
</html>
