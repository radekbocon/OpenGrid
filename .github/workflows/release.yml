name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build AppImage
        run: appimage/build-appimage.sh build

      - name: Generate source tarball
        run: |
          tar czf _build/SimLab-source.tar.gz \
            --exclude-vcs \
            --exclude='_build' \
            --exclude='.github' \
            --exclude='.idea' \
            --transform='s|^./|SimLab-${GITHUB_REF_NAME}/|' \
            -C "${{ github.workspace }}" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            _build/SimLab-x86_64.AppImage
            _build/SimLab-source.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
