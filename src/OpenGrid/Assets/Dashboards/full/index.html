<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Dashboard</title>
    <script src="/framework/opengrid.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111;
        }

        body {
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .dash {
            flex-shrink: 0;
            background: #000;
            padding: 12px;
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(9, 1fr);
            grid-template-rows: 120px 140px 140px 140px 120px;
        }

        .tile {
            border-radius: 8px;
            border: 2px solid #333;
            background: #111;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .label {
            font-size: 28px;
            letter-spacing: 2px;
        }

        .value {
            font-size: 48px;
            font-weight: bold;
        }

        .red {
            background: linear-gradient(#900, #f00);
        }

        .blue {
            background: linear-gradient(#1c5fa7, #3a9cff);
        }

        .gray {
            background: linear-gradient(#666, #d5d5d5);
            color: black;
        }

        .green {
            background: linear-gradient(#005f00, #18c918);
        }

        .yellow {
            background: linear-gradient(#c4a000, #ffd400);
            color: black;
        }

        .black {
            background: #050505;
        }

        .lap-counter {
            border-radius: 8px;
            border: 2px solid #555;
            background: #999;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .lap-counter .value {
            font-size: 54px;
        }

        .bbal {
            border-radius: 8px;
            border: 2px solid #555;
            background: #999;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .speed {
            border-radius: 8px;
            border: 2px solid #555;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .speed .value {
            color: black;
        }

        .rpm {
            border: 2px solid #555;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 15px;
        }

        .rpm-scale {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 10px;
            width: 100%;
        }

        .rpm-scale span {
            flex: 1;
            height: 14px;
            border-radius: 3px;
            background: #a00;
        }

        .center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gear {
            width: 290px;
            height: 260px;
            border-radius: 8px;
            background: linear-gradient(#ddd, #aaa);
            color: black;
            font-size: 150px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .footer-box {
            background: #111;
            border: 2px solid #444;
            color: white;
            border-radius: 8px;
            text-align: center;
            padding: 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .footer-title {
            font-size: 28px;
        }

        .footer-value {
            font-size: 48px;
        }
    </style>
</head>
<body>

<div class="dash">

    <div class="tile" style="grid-column:1/3;grid-row:1">
        <div class="label" id="sessDisp">RACE</div>
    </div>

    <div class="lap-counter" style="grid-column:3;grid-row:1">
        <div class="label">LAPCNTR</div>
        <div class="value" id="lapCntr">7</div>
    </div>

    <div class="rpm" style="grid-column:4/7;grid-row:1">
        <div class="rpm-scale" id="shiftLights">
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#0f0"></span>
            <span style="background:#ff0"></span>
            <span style="background:#660"></span>
            <span style="background:#600"></span>
            <span style="background:#600"></span>
        </div>
    </div>

    <div class="speed gray" style="grid-column:7/10;grid-row:1">
        <div class="label">SPEED</div>
        <div class="value" id="speedDisp">134.4</div>
    </div>

    <div class="tile red" style="grid-column:1;grid-row:2">
        <div class="label">P_FL</div>
        <div class="value" id="pfL">31.2</div>
    </div>

    <div class="tile blue" style="grid-column:2;grid-row:2">
        <div class="label">P_FR</div>
        <div class="value" id="pfR">25.2</div>
    </div>

    <div class="tile black" style="grid-column:1;grid-row:3">
        <div class="label">P_RL</div>
        <div class="value" id="prL">27.6</div>
    </div>

    <div class="tile black" style="grid-column:2;grid-row:3">
        <div class="label">P_RR</div>
        <div class="value" id="prR">24.9</div>
    </div>

    <div class="center" style="grid-column:3/8;grid-row:2/4">
        <div class="gear" id="gearDisp">3</div>
    </div>

    <div class="tile blue" style="grid-column:8;grid-row:2">
        <div class="label">T_FL</div>
        <div class="value" id="tfL">77</div>
    </div>

    <div class="tile black" style="grid-column:9;grid-row:2">
        <div class="label">T_FR</div>
        <div class="value" id="tfR">85</div>
    </div>

    <div class="tile blue" style="grid-column:8;grid-row:3">
        <div class="label">T_RL</div>
        <div class="value" id="trL">78</div>
    </div>

    <div class="tile red" style="grid-column:9;grid-row:3">
        <div class="label">T_RR</div>
        <div class="value" id="trR">111</div>
    </div>

    <div class="tile" style="grid-column:1;grid-row:4">
        <div class="label">MIX</div>
        <div class="value" id="mixDisp">3</div>
    </div>

    <div class="tile" style="grid-column:2;grid-row:4">
        <div class="label">POS</div>
        <div class="value" id="posDisp">15</div>
    </div>

    <div class="tile" style="grid-column:3;grid-row:4">
        <div class="label">ABS</div>
        <div class="value" id="absDisp">OFF</div>
    </div>

    <div class="tile yellow" style="grid-column:4;grid-row:4">
        <div class="label">FUEL</div>
        <div class="value" id="fuelDisp">27.4</div>
    </div>

    <div class="tile green" style="grid-column:5;grid-row:4">
        <div class="label">DIFF</div>
        <div class="value" id="deltaTime">-2.32</div>
    </div>

    <div class="bbal" style="grid-column:6;grid-row:4">
        <div class="label">BBAL</div>
        <div class="value" id="bbalDisp">65.4</div>
    </div>

    <div class="tile" style="grid-column:7;grid-row:4">
        <div class="label">TC1</div>
        <div class="value" id="tc1Disp">OFF</div>
    </div>

    <div class="tile" style="grid-column:8;grid-row:4">
        <div class="label">TC2</div>
        <div class="value" id="tc2Disp">OFF</div>
    </div>

    <div class="tile" style="grid-column:9;grid-row:4">
        <div class="label">TC3</div>
        <div class="value" id="tc3Disp">OFF</div>
    </div>

    <div class="footer-box" style="grid-column:1/4;grid-row:5">
        <div class="footer-title">PREV LAP</div>
        <div class="footer-value" id="prevLap">01:46.86</div>
    </div>

    <div class="footer-box" style="grid-column:4/7;grid-row:5">
        <div class="footer-title">LAP</div>
        <div class="footer-value" id="lastLap">01:46.86</div>
    </div>

    <div class="footer-box" style="grid-column:7/10;grid-row:5">
        <div class="footer-title">PREDICTED LAP</div>
        <div class="footer-value" id="predLap">01:46.47</div>
    </div>

</div>

<div id="status" style="display:none"></div>

<script>
    const numShiftLights = 12;
    let targetRpm = 0, currentRpm = 0, targetSpeed = 0, currentSpeed = 0, maxRpm = 8000;

    function scaleAll(s) {
        const d = document.querySelector('.dash');
        if (!d) return;
        d.style.width = Math.round(1280 * s) + 'px';
        d.style.height = Math.round(720 * s) + 'px';
        d.style.gap = Math.round(10 * s) + 'px';
        d.style.padding = Math.round(12 * s) + 'px';
        d.style.gridTemplateRows =
            Math.round(120 * s) + 'px ' +
            Math.round(140 * s) + 'px ' +
            Math.round(140 * s) + 'px ' +
            Math.round(140 * s) + 'px ' +
            Math.round(120 * s) + 'px';

        d.querySelectorAll('.label, .footer-title').forEach(function (e) {
            e.style.fontSize = Math.round(28 * s) + 'px';
            e.style.letterSpacing = Math.round(2 * s) + 'px';
        });

        d.querySelectorAll('.value').forEach(function (e) {
            e.style.fontSize = Math.round(48 * s) + 'px';
        });

        d.querySelectorAll('.lap-counter .value').forEach(function (e) {
            e.style.fontSize = Math.round(54 * s) + 'px';
        });

        d.querySelectorAll('.rpm').forEach(function (e) {
            e.style.padding = Math.round(15 * s) + 'px';
        });

        d.querySelectorAll('.rpm-scale').forEach(function (e) {
            e.style.gap = Math.round(5 * s) + 'px';
            e.style.marginTop = Math.round(10 * s) + 'px';
        });

        d.querySelectorAll('.rpm-scale span').forEach(function (e) {
            e.style.height = Math.round(14 * s) + 'px';
            e.style.borderRadius = Math.round(3 * s) + 'px';
        });

        d.querySelectorAll('.gear').forEach(function (e) {
            e.style.width = Math.round(290 * s) + 'px';
            e.style.height = Math.round(260 * s) + 'px';
            e.style.fontSize = Math.round(150 * s) + 'px';
            e.style.borderRadius = Math.round(8 * s) + 'px';
        });

        d.querySelectorAll('.tile, .lap-counter, .bbal, .speed, .rpm, .footer-box').forEach(function (e) {
            e.style.borderRadius = Math.round(8 * s) + 'px';
            e.style.borderWidth = Math.round(2 * s) + 'px';
        });

        d.querySelectorAll('.footer-box').forEach(function (e) {
            e.style.padding = Math.round(10 * s) + 'px';
        });

        d.querySelectorAll('.footer-value').forEach(function (e) {
            e.style.fontSize = Math.round(48 * s) + 'px';
        });

        var dte = document.getElementById('deltaTime');
        if (dte) dte.style.fontSize = Math.round(36 * s) + 'px';
    }

    function fitToViewport() {
        let s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
        scaleAll(s);
    }

    window.addEventListener('resize', fitToViewport);
    fitToViewport();

    function updateShiftLights(rp) {
        let lights = document.getElementById('shiftLights');
        let spans = lights.getElementsByTagName('span');
        for (let i = 0; i < numShiftLights && i < spans.length; i++) {
            let th = .6 + (i / numShiftLights) * .4;
            let on = rp >= th;
            if (i < 8) {
                spans[i].style.background = on ? '#0f0' : '#060';
            } else if (i < 10) {
                spans[i].style.background = on ? '#ff0' : '#660';
            } else {
                spans[i].style.background = on ? '#f00' : '#600';
            }
        }
    }

    function renderFrame() {
        let rp = Math.min(currentRpm / maxRpm, 1);
        document.getElementById('speedDisp').textContent = Math.round(currentSpeed).toString();
        updateShiftLights(rp);
    }

    function animationLoop() {
        currentRpm += (targetRpm - currentRpm) * .12;
        currentSpeed += (targetSpeed - currentSpeed) * .12;
        if (Math.abs(currentRpm - targetRpm) < 1) currentRpm = targetRpm;
        if (Math.abs(currentSpeed - targetSpeed) < .5) currentSpeed = targetSpeed;
        renderFrame();
        requestAnimationFrame(animationLoop);
    }

    function formatTime(ms) {
        if (!ms || ms <= 0) return '--:--';
        let s = ms / 1e3, m = Math.floor(s / 60);
        return m + ':' + ((s % 60) < 10 ? '0' : '') + (s % 60).toFixed(3);
    }

    OpenGrid.onTelemetry = function (d) {
        targetRpm = d.engineRpm || 0;
        maxRpm = d.maxRpm || 8000;
        targetSpeed = d.speedKmh || 0;
        document.getElementById('gearDisp').textContent = d.gear || 'N';
        document.getElementById('lapCntr').textContent = d.currentLap || '--';
        document.getElementById('prevLap').textContent = formatTime(d.lastLapTimeMs);
        document.getElementById('lastLap').textContent = formatTime(d.lapTimeMs);

        let de = document.getElementById('deltaTime');
        let dt = de.parentNode;
        if (d.deltaLapTimeMs !== undefined && d.deltaLapTimeMs !== null && !isNaN(d.deltaLapTimeMs)) {
            let sec = Math.abs(d.deltaLapTimeMs) / 1000;
            de.textContent = (d.deltaLapTimeMs >= 0 ? '+' : '-') + sec.toFixed(2);
            dt.className = d.deltaLapTimeMs >= 0 ? 'tile red' : 'tile green';
        } else {
            de.textContent = '--:--';
            dt.className = 'tile gray';
        }
        document.getElementById('fuelDisp').textContent = (d.fuel || 0).toFixed(1);
        document.getElementById('posDisp').textContent = d.position || '--';
        if (d.tireTemps) {
            const t = d.tireTemps;
            document.getElementById('tfL').textContent = Math.round(t.fl).toString();
            document.getElementById('tfR').textContent = Math.round(t.fr).toString();
            document.getElementById('trL').textContent = Math.round(t.rl).toString();
            document.getElementById('trR').textContent = Math.round(t.rr).toString();
        }
        if (d.tirePressures) {
            const p = d.tirePressures;
            document.getElementById('pfL').textContent = Math.round(p.fl).toString();
            document.getElementById('pfR').textContent = Math.round(p.fr).toString();
            document.getElementById('prL').textContent = Math.round(p.rl).toString();
            document.getElementById('prR').textContent = Math.round(p.rr).toString();
        }
        document.getElementById('sessDisp').textContent = d.sessionType || 'RACE';
        document.getElementById('bbalDisp').textContent = (d.brakeBias || 0).toFixed(1);

        function setTile(id, val) {
            var el = document.getElementById(id);
            if (!el) return;
            var p = el.parentNode;
            if (val === undefined || val === null || val === 0 || val === '0' || val === 'OFF') {
                el.textContent = 'OFF';
                p.className = 'tile red';
            } else {
                el.textContent = val;
                p.className = 'tile green';
            }
        }
        setTile('absDisp', d.absSetting);
        setTile('tc1Disp', d.tc1Setting);
        setTile('tc2Disp', d.tc2Setting);
        setTile('tc3Disp', d.tc3Setting);
    };

    OpenGrid.onConnected = function () {
    };
    OpenGrid.onDisconnected = function () {
    };
    OpenGrid.connect({port: 8190});
    animationLoop();
</script>
</body>
</html>
