<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SimLab Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: auto;
      background: #000;
      font-family: 'Courier New', monospace;
      color: white;
    }

    .fit-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .dashboard {
      width: 1280px;
      height: 720px;
      flex-shrink: 0;
      background: #000;
      padding: 8px;
      display: grid;
      grid-template-columns: 170px 170px 1fr 170px 170px;
      grid-template-rows: 110px 150px 150px 120px 110px;
      gap: 8px;
    }

    .panel {
      background: linear-gradient(to bottom, #2f2f2f 0%, #111 20%, #000 100%);
      border-radius: 8px;
      border: 2px solid #222;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .panel.blue {
      background: linear-gradient(to bottom, #53b4ff 0%, #2b8ded 50%, #1564b5 100%);
    }

    .panel.red {
      background: linear-gradient(to bottom, #ff3131 0%, #cf0000 50%, #8f0000 100%);
    }

    .panel.yellow {
      background: linear-gradient(to bottom, #ffe100 0%, #ffcb00 60%, #b59100 100%);
      color: #000;
    }

    .panel.green {
      background: linear-gradient(to bottom, #20d920 0%, #009900 60%, #005800 100%);
    }

    .panel.gray {
      background: linear-gradient(to bottom, #d9d9d9 0%, #888 50%, #555 100%);
      color: #fff;
    }

    .label {
      font-size: 28px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 58px;
      font-weight: bold;
      line-height: 1;
    }

    .small-value {
      font-size: 38px;
      font-weight: bold;
    }

    .tiny {
      font-size: 18px;
    }

    .top-bar {
      grid-column: 1 / span 5;
      display: grid;
      grid-template-columns: 170px 170px 1fr 170px 170px;
      gap: 8px;
    }

    .race-box {
      border: 2px solid #222;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 44px;
      letter-spacing: 3px;
      background: #050505;
    }

    .rpm-box {
      background: #000;
      border: 2px solid #222;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: end;
      height: 100%;
    }

    .rpm-bars {
      display: flex;
      gap: 3px;
      align-items: end;
      flex: 1;
      width: 100%;
    }

    .rpm-bar {
      flex: 1;
      height: 22px;
      border-radius: 3px;
      background: hsla(var(--hue), 100%, 20%, 0.2);
      transition: height 0.08s ease, background 0.08s ease, opacity 0.08s ease;
    }

    .rpm-bar.active {
      height: 34px;
      background: hsl(var(--hue), 100%, 55%);
    }

    @keyframes rpm-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.08; }
    }

    .rpm-bar.active.blink {
      animation: rpm-blink 0.12s ease-in-out infinite;
    }

    .gear-box {
      grid-column: 3;
      grid-row: 2 / span 2;
      background: linear-gradient(to bottom, #f0f0f0 0%, #bfbfbf 50%, #7d7d7d 100%);
      color: #000;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 170px;
      font-weight: bold;
      border: 2px solid #555;
      position: relative;
    }

    .bottom-strip {
      grid-column: 1 / span 5;
      display: grid;
      grid-template-columns: 2fr 2fr 2fr;
      gap: 8px;
    }

    .lap-box {
      background: #000;
      border: 2px solid #444;
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .lap-box .title {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .lap-box .time {
      font-size: 64px;
      font-weight: bold;
    }

    .mid-grid {
      grid-column: 1 / span 5;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 8px;
    }

    .off {
      color: white;
      font-size: 54px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="fit-container" id="fitContainer">
    <div class="dashboard" id="dashboard">
      <div class="top-bar">
        <div class="race-box" id="sessionLabel">RACE</div>

        <div class="panel gray">
          <div class="label">LAP</div>
          <div class="value" id="lapCntrValue">0</div>
        </div>

        <div class="rpm-box">
          <div class="rpm-bars" id="rpmBars"></div>
        </div>

        <div class="panel gray">
          <div class="label">BBAL</div>
          <div class="small-value" id="bbalValue">--</div>
        </div>

        <div class="panel gray">
          <div class="label">SPEED</div>
          <div class="value" id="speedValue">0</div>
        </div>
      </div>

      <div class="panel blue pressure">
        <div class="label">P_FL</div>
        <div class="value" id="pFl">--</div>
      </div>

      <div class="panel blue pressure">
        <div class="label">P_FR</div>
        <div class="value" id="pFr">--</div>
      </div>

      <div class="gear-box">
        <span id="gearValue">N</span>
      </div>

      <div class="panel blue temperature">
        <div class="label">T_FL</div>
        <div class="value" id="tFl">--</div>
      </div>

      <div class="panel blue temperature">
        <div class="label">T_FR</div>
        <div class="value" id="tFr">--</div>
      </div>

      <div class="panel blue pressure">
        <div class="label">P_RL</div>
        <div class="value" id="pRl">--</div>
      </div>

      <div class="panel blue pressure">
        <div class="label">P_RR</div>
        <div class="value" id="pRr">--</div>
      </div>

      <div class="panel blue temperature">
        <div class="label">T_RL</div>
        <div class="value" id="tRl">--</div>
      </div>

      <div class="panel blue temperature">
        <div class="label">T_RR</div>
        <div class="value" id="tRr">--</div>
      </div>

      <div class="mid-grid">
        <div class="panel status">
          <div class="label">MIX</div>
          <div class="value" id="mixValue">--</div>
        </div>

        <div class="panel status">
          <div class="label">POS</div>
          <div class="value" id="posValue">--</div>
        </div>

        <div class="panel red status">
          <div class="label">ABS</div>
          <div class="off" id="absStatus">OFF</div>
        </div>

        <div class="panel yellow status">
          <div class="label">FUEL</div>
          <div class="value" id="fuelValue">--</div>
        </div>

        <div class="panel gray status">
          <div class="label">LAP</div>
          <div class="value" id="lapTimeValue">--:--</div>
        </div>

        <div class="panel green status">
          <div class="label">PRED</div>
          <div class="value" id="predValue">--</div>
        </div>

        <div class="panel red status">
          <div class="label">TC1</div>
          <div class="off" id="tc1Status">OFF</div>
        </div>

        <div class="panel red status">
          <div class="label">TC2</div>
          <div class="off" id="tc2Status">OFF</div>
        </div>

        <div class="panel red status">
          <div class="label">TC3</div>
          <div class="off" id="tc3Status">OFF</div>
        </div>
      </div>

      <div class="bottom-strip">
        <div class="lap-box">
          <div class="title">LAST LAP</div>
          <div class="time" id="lastLapTime">--:--</div>
        </div>

        <div class="lap-box">
          <div class="title">CURRENT</div>
          <div class="time" id="currentLapTime">--:--</div>
        </div>

        <div class="lap-box">
          <div class="title">BEST LAP</div>
          <div class="time" id="bestLapTime">--:--</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DASHBOARD_W = 1280;
    const DASHBOARD_H = 720;

    function fitDashboard() {
      const dash = document.getElementById('dashboard');
      const scale = Math.min(
        window.innerWidth / DASHBOARD_W,
        window.innerHeight / DASHBOARD_H
      );
      dash.style.transform = 'scale(' + scale + ')';
    }

    window.addEventListener('resize', fitDashboard);
    window.addEventListener('load', fitDashboard);

    const BAR_COUNT = 16;

    function buildRpmBars() {
      const barsContainer = document.getElementById('rpmBars');
      barsContainer.innerHTML = '';

      for (let i = 0; i < BAR_COUNT; i++) {
        const bar = document.createElement('div');
        bar.className = 'rpm-bar';
        const hue = Math.round(120 - (i / (BAR_COUNT - 1)) * 120);
        bar.style.setProperty('--hue', hue);
        barsContainer.appendChild(bar);
      }
    }

    function updateRpmBars(rpm, maxRpm) {
      const bars = document.querySelectorAll('#rpmBars .rpm-bar');
      const pct = maxRpm > 0 ? Math.min(1, rpm / maxRpm) : 0;
      const activeIndex = Math.min(BAR_COUNT - 1, Math.floor(pct * BAR_COUNT));
      const blinking = pct >= 0.95;

      bars.forEach((bar, i) => {
        bar.classList.toggle('active', i <= activeIndex);
        bar.classList.toggle('blink', blinking && i <= activeIndex);
      });
    }

    function formatTime(ts) {
      if (!ts || ts === '--:--') return '--:--';
      return ts;
    }

    function getSessionLabel(type) {
      switch (type) {
        case 'Practice': return 'PRACTICE';
        case 'Qualify': return 'QUALIFY';
        case 'Race': return 'RACE';
        case 'HotLap': return 'HOTLAP';
        case 'TimeAttack': return 'ATTACK';
        case 'Drift': return 'DRIFT';
        case 'Drag': return 'DRAG';
        default: return 'SESSION';
      }
    }

    const gearMap = { '0': 'R', '1': 'N', '2': '1', '3': '2', '4': '3', '5': '4', '6': '5', '7': '6', '8': '7' };

    let rpmRange = 8000;

    function update(d) {
      document.getElementById('speedValue').textContent = Math.round(d.speed);

      document.getElementById('gearValue').textContent = gearMap[d.gear] ?? 'N';

      if (d.maxRpm && d.maxRpm > 0 && d.maxRpm !== rpmRange) {
        rpmRange = d.maxRpm;
        buildRpmBars();
      }
      updateRpmBars(d.rpm || 0, rpmRange);

      document.getElementById('lapCntrValue').textContent = d.currentLap ?? 0;

      document.getElementById('sessionLabel').textContent = getSessionLabel(d.sessionType);

      if (d.fuel != null) {
        document.getElementById('fuelValue').textContent = d.fuel.toFixed(1);
      }

      document.getElementById('currentLapTime').textContent = formatTime(d.lapTime);
      document.getElementById('lastLapTime').textContent = formatTime(d.lastLapTime);
      document.getElementById('bestLapTime').textContent = formatTime(d.bestLapTime);

      if (d.tireTemps) {
        const fl = d.tireTemps.fl;
        const fr = d.tireTemps.fr;
        const rl = d.tireTemps.rl;
        const rr = d.tireTemps.rr;
        document.getElementById('tFl').textContent = fl != null ? fl.toFixed(1) : '--';
        document.getElementById('tFr').textContent = fr != null ? fr.toFixed(1) : '--';
        document.getElementById('tRl').textContent = rl != null ? rl.toFixed(1) : '--';
        document.getElementById('tRr').textContent = rr != null ? rr.toFixed(1) : '--';
      }
      if (d.tirePressures) {
        const fl = d.tirePressures.fl;
        const fr = d.tirePressures.fr;
        const rl = d.tirePressures.rl;
        const rr = d.tirePressures.rr;
        document.getElementById('pFl').textContent = fl != null ? fl.toFixed(1) : '--';
        document.getElementById('pFr').textContent = fr != null ? fr.toFixed(1) : '--';
        document.getElementById('pRl').textContent = rl != null ? rl.toFixed(1) : '--';
        document.getElementById('pRr').textContent = rr != null ? rr.toFixed(1) : '--';
      }
      document.getElementById('absStatus').textContent = d.abs === 0 ? 'OFF' : d.abs;
      document.getElementById('tc1Status').textContent = d.tc1 === 0 ? 'OFF' : d.tc1;
    }

    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsUrl = scheme + '//' + location.host + '/ws';
    let ws;
    let reconnectTimer;

    function connect() {
      if (ws && ws.readyState === WebSocket.OPEN) return;
      ws = new WebSocket(wsUrl);
      ws.onopen = function() {
        document.body.style.opacity = '1';
      };
      ws.onclose = function() {
        document.body.style.opacity = '1';
        reconnectTimer = setTimeout(connect, 2000);
      };
      ws.onerror = function() { ws.close(); };
      ws.onmessage = function(e) {
        try {
          var msg = JSON.parse(e.data);
          if (msg.type === 'telemetry') update(msg.data);
          else if (msg.type === 'navigate') window.location.href = msg.url;
        } catch(_) {}
      };
    }

    function enterFullscreen() {
      var el = document.documentElement;
      if (el.requestFullscreen) {
        el.requestFullscreen().catch(function() {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      } else if (el.msRequestFullscreen) {
        el.msRequestFullscreen();
      }
    }

    document.addEventListener('click', enterFullscreen, { once: true });

    buildRpmBars();
    fitDashboard();
    connect();
  </script>
</body>
</html>
